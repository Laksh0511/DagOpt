[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagopt"
version = "0.1.0"
description = "DAG-Based Basic Block Optimizer"
authors = [{ name = "Lakshya" }]
requires-python = ">=3.10"
dependencies = [
    "graphviz",
]

[project.scripts]
dagopt = "dagopt.main:main"

[project.optional-dependencies]
test = [
    "pytest",
]
viz = [
    "matplotlib",
    "networkx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
